<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aquascape</title>
    <!--
      CSP is set at the transport layer, NOT via <meta http-equiv> here.
      Why: browsers AND multiple CSP sources, taking the most restrictive
      directive from each. The Electron shell's dev-only CSP needs
      `'unsafe-eval'` in `script-src` so AJV's runtime schema compile works
      (see apps/desktop/src/main/csp.ts + plans/stage-4-followup-precompile-ajv.md).
      A meta CSP with `script-src 'self'` would silently override that
      relaxation and break the renderer. The meta tag is also a duplicate of
      what the Electron shell sets via `session.webRequest.onHeadersReceived`.

      Production web deploys MUST set the CSP via server response headers.
      A `script-src 'self'` baseline is the right default — see the strict
      ELECTRON_CSP constant for the desktop counterpart.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Stage 6 F6.4 — PWA install affordance. Chromium / Edge / Firefox
         read the manifest at runtime to surface an "Install Aquascape"
         button; iOS reads `apple-touch-icon` for Add-to-Home-Screen. The
         theme-color drives the browser chrome / status-bar tint on
         mobile + the PWA splash screen on Android. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0891b2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aquascape" />
  </head>
  <body>
    <aquascape-root></aquascape-root>
  </body>
</html>
